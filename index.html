<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveLink Legal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(180px);
    opacity:.35;
    border-radius:50%;
    top:-150px;
    left:-150px;
}

body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#7c3aed;
    filter:blur(180px);
    opacity:.25;
    border-radius:50%;
    bottom:-150px;
    right:-150px;
}

.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:50px;
    text-align:center;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    margin-bottom:40px;
}

.links{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

a{
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:15px 30px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

a:hover{
    transform:translateY(-4px);
    box-shadow:0 0 25px rgba(37,99,235,.5);
}
</style>

</head>
<body>

<div class="container">

<h1>WaveLink</h1>

<p>
This website exists solely to provide the legal documents required for the WaveLink Roblox OAuth application.
</p>

<div class="links">
<a href="privacy.html">Privacy Policy</a>
<a href="terms.html">Terms of Service</a>
</div>

</div>

</body>
</html>
